<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu décimo formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on"> 
        <p>
            <label for="iano">Qual seu ano de nascimento:</label>
            <input type="number" name="ano" id="iano" min="1925" max="2025" oninput="calcIdade()">
        </p>
        <p>
            <label for="iidade">Sua idade é: </label>
            <output id="iidade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTMl = Number(atual) - Number(iano.value)
        }
    </script>

</body>
</html>
